<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Oilaviy shajara</title>
<!--
  Kirish sahifasi (qulf). Dizaynini xohlagancha oʻzgartirish mumkin, lekin:
  - pastdagi "const P = ..." qatoridagi joy tutuvchi aynan shu koʻrinishda qolishi kerak;
  - normCode() scripts/encrypt.mjs dagi bilan bir xil boʻlishi kerak;
  - bu yerda oila nomi yoki ismlar yozilmasin: qulf sahifasini hamma koʻradi.
-->
<style>
:root{--bg:#eceef3;--card:rgba(255,255,255,.6);--edge:rgba(255,255,255,.75);--hi:rgba(255,255,255,.95);--spec:rgba(255,255,255,.55);--ink:#141a24;--muted:#4b5566;--line:rgba(20,28,42,.14);--field:rgba(255,255,255,.7);--accent:#4a46a0;--on:#fff;--err:#b3261e;--blob:.55;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0c1017;--card:rgba(22,26,34,.56);--edge:rgba(255,255,255,.09);--hi:rgba(255,255,255,.12);--spec:rgba(255,255,255,.07);--ink:#eef1f6;--muted:#aab3c2;--line:rgba(230,236,246,.16);--field:rgba(255,255,255,.06);--accent:#a9a5f2;--on:#14122e;--err:#ff8a80;--blob:.32;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));overflow:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;opacity:var(--blob)}
.bg i:nth-child(1){background:radial-gradient(circle,#c99a55 0,transparent 62%);left:-24vmax;top:-26vmax;animation:d1 46s ease-in-out infinite alternate}
.bg i:nth-child(2){background:radial-gradient(circle,#8d89cf 0,transparent 62%);right:-26vmax;top:-18vmax;animation:d2 52s ease-in-out infinite alternate}
.bg i:nth-child(3){background:radial-gradient(circle,#5ea7b0 0,transparent 62%);left:-14vmax;bottom:-34vmax;animation:d1 58s ease-in-out infinite alternate-reverse}
.bg i:nth-child(4){background:radial-gradient(circle,#cf86a2 0,transparent 62%);right:-20vmax;bottom:-30vmax;animation:d2 49s ease-in-out infinite alternate-reverse}
@keyframes d1{to{transform:translate(14vmax,10vmax) scale(1.08)}}
@keyframes d2{to{transform:translate(-12vmax,14vmax) scale(.94)}}
.card{position:relative;isolation:isolate;width:min(400px,100%);background:var(--card);border:1px solid var(--edge);border-radius:28px;padding:30px 26px 26px;-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);box-shadow:inset 0 1px 0 var(--hi),0 30px 70px -20px rgba(28,36,62,.4),0 2px 8px rgba(28,36,62,.08)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(170deg,var(--spec),transparent 42%);pointer-events:none;z-index:-1}
.mark{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;margin-bottom:18px;background:linear-gradient(140deg,#5450ad,#1d7883);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 24px -8px rgba(84,80,173,.6)}
.mark svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{margin:0 0 6px;font:700 28px/1.15 Georgia,"Times New Roman",serif;letter-spacing:-.005em}
p{margin:0 0 20px;color:var(--muted);font-size:15px}
form{display:grid;gap:10px}
label{font-size:13px;color:var(--muted);font-weight:500}
input[type=password]{width:100%;font:500 17px system-ui,sans-serif;padding:13px 16px;border-radius:16px;border:1px solid var(--line);background:var(--field);color:var(--ink)}
input[type=password]:focus{outline:2.5px solid var(--accent);outline-offset:1px}
.chk{display:flex;gap:10px;align-items:center;color:var(--ink);font-size:14.5px;margin:4px 0}
.chk input{width:19px;height:19px;accent-color:var(--accent)}
button{margin-top:6px;font:600 16px system-ui,sans-serif;padding:13px 16px;border-radius:999px;border:0;background:var(--accent);color:var(--on);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 24px -10px rgba(74,70,160,.7)}
button:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}
button[disabled]{opacity:.6;cursor:default}
.err{margin:6px 0 0;color:var(--err);font-size:14px}
[hidden]{display:none!important}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card{background:var(--bg)}}
@media (prefers-reduced-transparency:reduce){.card{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--bg)}.card::before{display:none}}
@media (prefers-reduced-motion:reduce){.bg i{animation:none}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<main class="card">
  <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="3"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg></div>
  <h1>Oilaviy shajara</h1>
  <p>Sahifani ochish uchun oila kodini kiriting.</p>
  <form id="f" autocomplete="on">
    <label for="kod">Kirish kodi</label>
    <input id="kod" name="kod" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <label class="chk" for="eslab"><input type="checkbox" id="eslab"> Shu qurilmada eslab qolish</label>
    <button type="submit" id="btn">Ochish</button>
    <p class="err" id="err" role="alert" hidden></p>
  </form>
</main>

  $('f').addEventListener('submit', async ev => {
    ev.preventDefault();
    const code = normCode($('kod').value);
    if (!code) return;
    const btn = $('btn');
    btn.disabled = true; btn.textContent = 'Ochilmoqda…'; $('err').hidden = true;
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(P.salt), iterations: P.it, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      const html = await open(key);
      if ($('eslab').checked){
        try { localStorage.setItem(KEY, b64(new Uint8Array(await crypto.subtle.exportKey('raw', key)))); } catch (_) {}
      }
      show(html);
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Ochish';
      showErr('Kod notoʻgʻri. Qayta urinib koʻring.');
      $('kod').select();
    }
  });
})();
</script>
</body>
</html>
